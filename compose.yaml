# Local development stack: `docker compose up --build`
# Web http://localhost:5173 · API http://localhost:8010/docs · Postgres localhost:5433
name: syncsight

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: syncsight
      POSTGRES_PASSWORD: syncsight
      POSTGRES_DB: syncsight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncsight -d syncsight"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn syncsight.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    environment:
      SYNCSIGHT_DATABASE_URL: postgresql+psycopg://syncsight:syncsight@db:5432/syncsight
    ports:
      - "8010:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
